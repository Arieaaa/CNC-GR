<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1a1a1a">图3 覆盖重叠与移动关联：模型算出的信号如何决定切换</text>
  <text x="24" y="58" font-size="14" fill="#555">参数：mode=g、txpower=14 dBm、天线增益各 5 dBi、logDistance exp=3（下表数值为模型算术结果，非实测）</text>

  <!-- ===== left: floor plan, 1 m = 5 px, origin (80,560) bottom-left of a 500x500 box ===== -->
  <rect x="80" y="60" width="500" height="500" fill="#fcfcfd" stroke="#333"/>
  <g stroke="#e6e6ea">
    <line x1="180" y1="60" x2="180" y2="560"/><line x1="280" y1="60" x2="280" y2="560"/>
    <line x1="380" y1="60" x2="380" y2="560"/><line x1="480" y1="60" x2="480" y2="560"/>
    <line x1="580" y1="60" x2="580" y2="560"/>
    <line x1="80" y1="160" x2="580" y2="160"/><line x1="80" y1="260" x2="580" y2="260"/>
    <line x1="80" y1="360" x2="580" y2="360"/><line x1="80" y1="460" x2="580" y2="460"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="180" y="578">20</text><text x="280" y="578">40</text><text x="380" y="578">60</text><text x="480" y="578">80</text><text x="580" y="578">100</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="end">
    <text x="74" y="464">20</text><text x="74" y="364">40</text><text x="74" y="264">60</text><text x="74" y="164">80</text><text x="74" y="64">100</text>
  </g>
  <text x="330" y="600" font-size="12" fill="#666">场地坐标 (m)，图幅 100×100</text>

  <!-- ap1 (40,35) -> (280, 385); ap2 (40,65) -> (280, 235) -->
  <!-- -72 dBm ring r=73.6 m = 368 px (clipped by box) -->
  <g stroke="#7fa8d8" fill="none" stroke-dasharray="6 4">
    <circle cx="280" cy="385" r="368"/>
    <circle cx="280" cy="235" r="368"/>
  </g>
  <!-- -62 dBm ring r=34.1 m = 170.5 px -->
  <g stroke="#2f6fb5" fill="#2f6fb5" fill-opacity="0.08">
    <circle cx="280" cy="385" r="170.5"/>
    <circle cx="280" cy="235" r="170.5"/>
  </g>
  <text x="118" y="418" font-size="12" fill="#2f6fb5">-62 dBm（34.1 m）</text>
  <text x="440" y="212" font-size="12" fill="#2f6fb5">-62 dBm（34.1 m）</text>
  <text x="452" y="126" font-size="12" fill="#7fa8d8">-72 dBm（73.6 m）</text>

  <!-- APs -->
  <g>
    <rect x="268" y="373" width="24" height="24" fill="#0b3d91"/>
    <text x="300" y="392" font-size="14" font-weight="700" fill="#0b3d91">ap1 (40,35) ch1</text>
    <rect x="268" y="223" width="24" height="24" fill="#7a3ea1"/>
    <text x="300" y="242" font-size="14" font-weight="700" fill="#7a3ea1">ap2 (40,65) ch1 或 ch6</text>
  </g>

  <!-- moving route x=40 from y=20 (px 460) to y=80 (px 160) -->
  <line x1="280" y1="460" x2="280" y2="160" stroke="#c98a1c" stroke-width="3"/>
  <polygon points="280,150 274,166 286,166" fill="#c98a1c"/>
  <text x="292" y="470" font-size="12" fill="#8a5212">起点 (40,20)</text>
  <text x="292" y="152" font-size="12" fill="#8a5212">终点 (40,80)</text>

  <!-- crossing point y=50 -> px 310 -->
  <circle cx="280" cy="310" r="6" fill="#d33"/>
  <text x="296" y="314" font-size="13" font-weight="700" fill="#d33">等强度点 (40,50)：两侧均 15 m → RSSI 都算成 -51 dBm</text>
  <text x="296" y="334" font-size="12" fill="#a33">SSF 在此点附近来回跨过 1 dB 台阶 → 反复切换风险</text>
  <text x="296" y="352" font-size="12" fill="#555">LLF 在此点不看信号，只看候选 AP 是否少 ≥3 个终端</text>

  <!-- ===== right: numbers ===== -->
  <rect x="620" y="70" width="476" height="230" fill="#f7f9fc" stroke="#c8d4e6"/>
  <text x="636" y="96" font-size="15" font-weight="700" fill="#0b3d91">RSSI 随距离（同一公式，两种 exp）</text>
  <g font-size="12" fill="#222">
    <text x="636" y="122">d (m)</text>
    <text x="700" y="122">5</text><text x="748" y="122">10</text><text x="796" y="122">15</text><text x="844" y="122">20</text>
    <text x="892" y="122">30</text><text x="940" y="122">40</text><text x="988" y="122">60</text><text x="1036" y="122">80</text>
    <text x="636" y="146">exp=3</text>
    <text x="700" y="146">-36</text><text x="748" y="146">-46</text><text x="796" y="146">-51</text><text x="844" y="146">-55</text>
    <text x="892" y="146">-60</text><text x="940" y="146">-64</text><text x="988" y="146">-69</text><text x="1036" y="146">-73</text>
    <text x="636" y="170">exp=4</text>
    <text x="700" y="170">-43</text><text x="748" y="170">-56</text><text x="796" y="170">-63</text><text x="844" y="170">-68</text>
    <text x="892" y="170">-75</text><text x="940" y="170">-80</text><text x="988" y="170">-87</text><text x="1036" y="170">-92</text>
  </g>
  <line x1="636" y1="184" x2="1080" y2="184" stroke="#d5deec"/>
  <g font-size="12.5" fill="#222">
    <text x="636" y="206">门限所在距离：-62 dBm → exp=3 为 34.1 m，exp=4 缩到 14.1 m</text>
    <text x="636" y="226">-72 dBm → 73.6 m / 25.1 m；-82 dBm → 158.5 m（超出图幅）/ 44.7 m</text>
    <text x="636" y="246">txpower 只加 3 dB → 半径约 1.26 倍，远弱于改 exp</text>
    <text x="636" y="266">CCA=-90 dBm：exp=3 时要到 293 m，本实验尺度碰不到</text>
    <text x="636" y="286">→ 差异主要来自关联判定式，不是"信号低到听不见"</text>
  </g>

  <!-- ===== bottom right: two gates ===== -->
  <rect x="620" y="320" width="476" height="230" fill="#fffdf7" stroke="#e3d3ad"/>
  <text x="636" y="346" font-size="15" font-weight="700" fill="#8a5212">本原型里的两道"门"（与教材叙述不同，需注意）</text>
  <g font-size="12.5" fill="#222">
    <text x="636" y="372">① 准入门：能不能关联，用的是距离 vs AP 的 range，</text>
    <text x="650" y="390">range 默认由信号模型反算；功率不够时会打印</text>
    <text x="650" y="408">"requested ... cannot be satisfied"，小数功率还会截断。</text>
    <text x="636" y="436">② 重关联门：移动后换不换 AP，由 ac_method 打开，</text>
    <text x="650" y="454">判定挂在移动性对象上——不传就不做重关联评估。</text>
    <text x="636" y="482">SSF：候选整数 RSSI 高 1 dB 就切（无门限、无冷却）</text>
    <text x="636" y="502">LLF：候选 AP 少 ≥3 个终端才切（内置滞回，不看信号）</text>
    <text x="636" y="534" fill="#777">依据：net.py:837-840, 218-219；link.py:324-326, 300-321, 349-356；associationControl.py:23, 42</text>
    <text x="636" y="548" fill="#777">propagationModels.py:19-31, 103-120（mininet-wifi master，2026-11-06 副本）</text>
  </g>
</svg>
